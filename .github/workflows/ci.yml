# Kiểm tra chất lượng cho mọi Pull Request và push lên nhánh chính
name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Phiên bản pnpm lấy từ trường packageManager trong package.json gốc
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Cài dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Type-check toàn bộ workspace
        run: pnpm typecheck

      - name: Lint (web + api)
        run: pnpm lint
